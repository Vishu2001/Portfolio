# Production profile: activated with SPRING_PROFILES_ACTIVE=prod (set by the ECS task definition).
# Loaded on top of application.properties and overrides it.
#
# No defaults on purpose: if AWS doesn't provide a value, the app refuses to start instead of
# silently falling back to the laptop's localhost settings.
#   DB_URL                  : plain env var in the ECS task definition (RDS endpoint, not secret)
#   DB_USERNAME/DB_PASSWORD : injected by ECS from AWS Secrets Manager (never in code or git)
#   APP_CORS_ALLOWED_ORIGINS: the public frontend URL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Keep a small connection pool: one db.t4g.micro instance, one backend task
spring.datasource.hikari.maximum-pool-size=5

# Health endpoint: say UP/DOWN only, never internal details, to the public internet
management.endpoint.health.show-details=never
