spring.application.name=portfolio-api
server.port=8080

# Frontend origins allowed to call /api/** (comma-separated).
# Override in production with the env variable APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=http://localhost:3000

# ---------- Database ----------
# Defaults point at the local Docker MySQL (docker-compose.yml, host port 3307).
# On AWS, the same keys come from env variables instead, e.g.
#   DB_URL=jdbc:mysql://<rds-endpoint>:3306/portfolio  DB_USERNAME=...  DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/portfolio}
spring.datasource.username=${DB_USERNAME:portfolio}
spring.datasource.password=${DB_PASSWORD:portfolio}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# that the entities match the tables and never changes the database itself.
spring.jpa.hibernate.ddl-auto=validate
# Store Instants as plain DATETIME in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
# Don't keep DB sessions open while rendering HTTP responses
spring.jpa.open-in-view=false

# ---------- Redis (rate limiting) ----------
# Local default: Redis from docker-compose on laptop port 6380 (like MySQL on 3307).
# On AWS: REDIS_HOST=localhost, REDIS_PORT=6379 (a Redis sidecar container in the same ECS task).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
# Give up quickly if Redis is down; the rate limiter then fails open (allows the request)
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# Contact form: at most 5 submissions per minute per client IP
app.rate-limit.contact.max-requests=5
app.rate-limit.contact.window=1m
# Proxies in front of the app whose X-Forwarded-For entries we trust (0 = none, locally)
app.rate-limit.trusted-proxies=0

# Actuator: expose only health + info over HTTP. /actuator/health also reports the
# database status, and is what Docker, ECS and Kubernetes use to check the app.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
