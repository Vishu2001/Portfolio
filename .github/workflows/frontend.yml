# Frontend pipeline: runs ONLY when something inside frontend/ (or this file) changes.
name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============ Job 1: install, lint, type-check, build ============
  check:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        # "next typegen" runs first inside this script: Next.js generates route types
        # (LayoutProps etc.) into git-ignored files that a fresh checkout doesn't have.
        run: npm run typecheck

      - name: Production build
        run: npm run build

  # ============ Job 2: build the Docker image (only if checks passed) ============
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: portfolio-web:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
