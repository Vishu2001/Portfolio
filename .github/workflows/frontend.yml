# Frontend pipeline: runs ONLY when something inside frontend/ (or this file) changes.
#   pull request : lint, type-check, build → build image (no AWS access)
#   push to main : same → build + push image to ECR → deploy to ECS
name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  AWS_DEPLOY_ROLE: arn:aws:iam::060668531152:role/portfolio-github-deploy
  ECR_REPOSITORY: portfolio-web
  ECS_CLUSTER: portfolio
  ECS_SERVICE: portfolio-web
  CONTAINER_NAME: web

jobs:
  # ============ Job 1: install, lint, type-check, build ============
  check:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        # "next typegen" runs first inside this script: Next.js generates route types
        # (LayoutProps etc.) into git-ignored files that a fresh checkout doesn't have.
        run: npm run typecheck

      - name: Production build
        run: npm run build

  # ============ Job 2: build the image; on main also push it to ECR ============
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    env:
      IS_DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Log in to AWS (OIDC, no stored keys)
        if: env.IS_DEPLOY == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: env.IS_DEPLOY == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Work out the image name
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry || 'local' }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Skip the push if this commit's image already exists (re-runs; tags are immutable)
        if: env.IS_DEPLOY == 'true'
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Image for $GITHUB_SHA already in ECR, reusing it."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build (and on main, push) the frontend image
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ env.IS_DEPLOY == 'true' }}
          tags: ${{ steps.meta.outputs.image }}
          # Empty API URL = the browser calls "/api/..." on the same address as the page
          # (the load balancer routes /api/* to the backend). No CORS, no hard-coded host.
          build-args: |
            NEXT_PUBLIC_API_URL=
          provenance: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ============ Job 3: deploy the new image to ECS (main only) ============
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: http://portfolio-alb-1369660137.ap-southeast-2.elb.amazonaws.com/
    steps:
      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download the current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_SERVICE" \
            --query taskDefinition > task-definition.json

      - name: Put the new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.docker.outputs.image }}

      - name: Deploy to ECS and wait until the service is healthy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15
