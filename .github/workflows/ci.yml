# CI = Continuous Integration: check every change automatically.
# GitHub reads every file in .github/workflows/ and runs it when its "on:" trigger matches.
name: CI

# ---------------------------------------------------------------- WHEN to run
on:
  push:
    branches: [main]        # every push to main
  pull_request:             # every pull request (checks the change before merging)
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

# If you push twice quickly, cancel the older run instead of running both
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the code (least privilege)
permissions:
  contents: read

# ---------------------------------------------------------------- WHAT to run
jobs:

  # ============ Job 1: backend — compile + all tests against a real MySQL ============
  backend:
    name: Backend (Java 21, tests)
    runs-on: ubuntu-latest            # a fresh Ubuntu VM with Docker preinstalled
    defaults:
      run:
        working-directory: backend    # every "run:" command starts in backend/
    steps:
      - name: Check out the code
        uses: actions/checkout@v5     # clones this repo onto the runner

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven                # reuses downloaded dependencies between runs

      - name: Build and run tests
        # verify = compile + unit tests + integration tests + package.
        # Testcontainers starts MySQL 8.4 in the runner's Docker, exactly like on your laptop.
        run: mvn -B verify

  # ============ Job 2: frontend — install, lint, type-check, build ============
  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci                   # exact versions from package-lock.json

      - name: Lint
        run: npm run lint

      - name: Type-check
        # "next typegen" first: Next.js generates route types (LayoutProps etc.) into
        # git-ignored files, so a fresh checkout doesn't have them until this runs.
        run: npm run typecheck

      - name: Production build
        run: npm run build

  # ============ Job 3: docker — build both images (only if jobs 1 and 2 passed) ============
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]        # waits for both; skipped if either fails
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3   # Docker's modern builder (needed for caching)

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false                 # build only; pushing to AWS ECR comes in the deploy step
          tags: portfolio-api:ci
          cache-from: type=gha,scope=backend   # reuse layers from earlier runs
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: portfolio-web:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
