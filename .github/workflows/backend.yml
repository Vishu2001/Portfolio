# Backend pipeline: runs ONLY when something inside backend/ (or this file) changes.
#   pull request : test → build image (no AWS access)
#   push to main : test → build + push image to ECR → deploy to ECS
name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"   # editing the pipeline itself also re-runs it
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:                      # manual "Run workflow" button

# If you push twice quickly, cancel the older backend run
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  # Not a secret: an ARN only names the role. Only this repo's main branch may assume it
  # (enforced by the role's trust policy in AWS, see infra/aws/07-github-oidc.ps1).
  AWS_DEPLOY_ROLE: arn:aws:iam::060668531152:role/portfolio-github-deploy
  ECR_REPOSITORY: portfolio-api
  ECS_CLUSTER: portfolio
  ECS_SERVICE: portfolio-api
  CONTAINER_NAME: api

jobs:
  # ============ Job 1: compile + all tests against a real MySQL ============
  test:
    name: Test (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        # verify = compile + unit tests + integration tests + package.
        # Testcontainers starts MySQL 8.4 in the runner's Docker.
        run: mvn -B verify

  # ============ Job 2: build the image; on main also push it to ECR ============
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write                 # lets the job request GitHub's OIDC token (for AWS login)
    outputs:
      image: ${{ steps.meta.outputs.image }}
    env:
      IS_DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Log in to AWS (OIDC, no stored keys)
        if: env.IS_DEPLOY == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: env.IS_DEPLOY == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Work out the image name
        id: meta
        # Tag = full commit SHA, so every running image traces back to exact code
        run: echo "image=${{ steps.ecr.outputs.registry || 'local' }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Skip the push if this commit's image already exists (re-runs; tags are immutable)
        if: env.IS_DEPLOY == 'true'
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Image for $GITHUB_SHA already in ECR, reusing it."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build (and on main, push) the backend image
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ env.IS_DEPLOY == 'true' }}
          tags: ${{ steps.meta.outputs.image }}
          provenance: false           # plain single-platform image in ECR
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ============ Job 3: deploy the new image to ECS (main only) ============
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production                # shows deployments on the repo page
      url: https://dxssrknfb9kyt.cloudfront.net/actuator/health
    steps:
      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download the current task definition
        # Keeps everything set by infra/aws/05-ecs-backend.ps1 (env vars, secrets, CPU/memory)
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_SERVICE" \
            --query taskDefinition > task-definition.json

      - name: Put the new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.docker.outputs.image }}

      - name: Deploy to ECS and wait until the service is healthy
        # Rolling update: new task starts, passes health checks, then the old one stops.
        # If the new version keeps failing, ECS's circuit breaker rolls back automatically.
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15
