# Backend pipeline: runs ONLY when something inside backend/ (or this file) changes.
name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"   # editing the pipeline itself also re-runs it
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:                      # manual "Run workflow" button

# If you push twice quickly, cancel the older backend run
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============ Job 1: compile + all tests against a real MySQL ============
  test:
    name: Test (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        # verify = compile + unit tests + integration tests + package.
        # Testcontainers starts MySQL 8.4 in the runner's Docker.
        run: mvn -B verify

  # ============ Job 2: build the Docker image (only if tests passed) ============
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false                 # pushing to AWS ECR comes with the deploy step
          tags: portfolio-api:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
